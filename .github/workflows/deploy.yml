name: Deploy CloudFront

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudfront-${{ vars.STACK_NAME || 'amazon-cloudfront-demo' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: ${{ vars.STACK_NAME || 'amazon-cloudfront-demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate before deploying
        run: |
          python -m pip install -r requirements-dev.txt
          cfn-lint infra/cloudfront.yaml
          bash -n scripts/deploy.sh
          node --check site/app.js
          node tests/site.test.cjs
          python -m unittest discover -s tests -v
      - name: Check AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo 'Configura la variable AWS_ROLE_ARN del environment aws-demo. Consulta README.md.' >&2
            exit 1
          fi
      - name: Authenticate with AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-cloudfront-demo
      - name: Deploy and verify
        run: bash scripts/deploy.sh
      - name: Upload real deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudfront-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
