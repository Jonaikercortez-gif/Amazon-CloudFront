name: Deploy CloudFront

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudfront-${{ vars.PROJECT_NAME || 'amazon-cloudfront-tf' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'amazon-cloudfront-tf' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'amazon-cloudfront-tf/terraform.tfstate' }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Validate before deploying
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate.py
      - name: Check AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo 'Configura AWS_ROLE_ARN en el environment aws-demo. Consulta docs/despliegue-aws.md.' >&2
            exit 1
          fi
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo 'Configura TF_STATE_BUCKET: el estado debe conservarse fuera del runner. Consulta docs/despliegue-aws.md.' >&2
            exit 1
          fi
      - name: Authenticate with AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-cloudfront-demo
      - name: Configure persistent Terraform state
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          backend = {"terraform": {"backend": {"s3": {
              "bucket": os.environ["TF_STATE_BUCKET"],
              "key": os.environ["TF_STATE_KEY"],
              "region": os.environ["TF_STATE_REGION"],
              "encrypt": True,
              "use_lockfile": True,
          }}}}
          Path('infra/terraform/backend.auto.tf.json').write_text(json.dumps(backend, indent=2) + '\n')
          PY
      - name: Deploy and verify
        run: bash scripts/deploy.sh
      - name: Upload real deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudfront-evidence-${{ github.run_id }}
          path: |
            evidence/outputs.json
            evidence/verification.json
          if-no-files-found: ignore
          retention-days: 14
