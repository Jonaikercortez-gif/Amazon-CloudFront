name: Validate CloudFront

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate configuration without deploying AWS resources
        run: python scripts/validate.py
      - name: Save configuration validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudfront-configuration-${{ github.run_id }}-${{ github.event_name }}
          path: |
            evidence/configuration-validation.json
            evidence/configuration-validation.log
          if-no-files-found: ignore
          retention-days: 30
